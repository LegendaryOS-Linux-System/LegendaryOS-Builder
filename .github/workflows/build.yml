name: Build legendaryos-builder

# Buduje legendaryos-builder ze źródeł. Kompilator H# (hsharp) i menedżer pakietów bit są pobierane jako gotowe
# binarki z wydań GitHub (adresy w sekcji `env`; istnienie ani format plików nie jest sprawdzane).
# Wynik: artefakt `legendaryos-builder-linux-x86_64` (+ SHA256SUMS). Wydanie GitHub powstaje po wypchnięciu tagu `v*`
# albo ręcznie (Run workflow -> publish), z tagiem równym wersji z Bit.hk.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Uruchomić testy?"
        type: boolean
        default: true
      publish:
        description: "Opublikować wydanie GitHub (tag = wersja z Bit.hk)?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HSHARP_URL: https://github.com/HackerOS-Linux-System/H-Sharp/releases/download/v1.0/hsharp
  BIT_URL: https://github.com/HackerOS-Linux-System/bit/releases/download/v0.3/bit
  # biblioteka standardowa H# (/usr/lib/HackerOS/H#/std) pochodzi z repozytorium H-Sharp
  # (tag z wydania; gdy go nie ma, używana jest domyślna gałąź)
  HSHARP_STD_REF: v1.0
  NO_COLOR: "1"
  HSHARP_COLOR: "0"

jobs:
  build:
    name: Build legendaryos-builder
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ make git curl ca-certificates findutils gawk

      - name: H# (hsharp) i bit z wydań
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/hsharp "$HSHARP_URL"
          curl -fsSL --retry 3 -o /tmp/bit "$BIT_URL"
          sudo install -m 0755 /tmp/hsharp /usr/local/bin/hsharp
          sudo ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
          sudo install -m 0755 /tmp/bit /usr/local/bin/bit

      - name: Biblioteka standardowa H#
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/h-sharp"
          git clone --depth 1 --branch "$HSHARP_STD_REF" https://github.com/HackerOS-Linux-System/H-Sharp.git "$SRC" \
            || git clone --depth 1 https://github.com/HackerOS-Linux-System/H-Sharp.git "$SRC"
          sudo rm -rf "/usr/lib/HackerOS/H#/std"
          sudo mkdir -p "/usr/lib/HackerOS/H#/std"
          sudo cp -a "$SRC/std/." "/usr/lib/HackerOS/H#/std/"

      - name: Wersja z Bit.hk
        id: ver
        run: |
          V="$(awk '$1=="->" && $2=="version" && $3=="=>" {print $4; exit}' Bit.hk)"
          echo "Wersja: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Zależności projektu (bit install)
        run: bit install

      - name: Budowa (bit build --release)
        run: |
          set -euo pipefail
          bit build --release

      - name: Zbierz artefakty
        run: |
          set -euo pipefail
          mkdir -p dist
          D=cache/build/release
          BIN=""
          if [ -f "$D/legendaryos-builder" ] && [ -x "$D/legendaryos-builder" ]; then BIN="$D/legendaryos-builder"; fi
          if [ -z "$BIN" ]; then
            BIN="$(find "$D" -maxdepth 2 -type f -perm -u+x ! -name '*.so' ! -name '*.a' ! -name '*.o' ! -name '*.sh' 2>/dev/null | head -n 1)"
          fi
          [ -n "$BIN" ] || { echo "::error::bit build nie wytworzył binarki w $D"; ls -la "$D" || true; exit 1; }
          install -m 0755 "$BIN" dist/legendaryos-builder
          ls -l dist
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Testy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          set -uo pipefail
          "dist/legendaryos-builder" version

      - uses: actions/upload-artifact@v4
        with:
          name: legendaryos-builder-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Wydanie GitHub
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: legendaryos-builder ${{ steps.ver.outputs.version }}
